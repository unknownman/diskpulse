[package]
name = "diskpulse"
version = "0.1.0"
edition = "2021"
description = "A fast, safe, and beautiful disk visualizer and cache cleaner"
license = "MIT OR Apache-2.0"

[dependencies]
# CLI Parsing
clap = { version = "4.5", features = ["derive", "cargo", "env"] }
clap_complete = "4.5"
unicode-width = "0.2"

# Graceful Ctrl+C handling on a dedicated thread
ctrlc = { version = "3.4", features = ["termination"] }

# High-Performance Directory Traversal
jwalk = "0.8"
walkdir = "2.5"
globset = "0.4"

# Platform-native directories
directories = "5.0"

# Safe File Deletion / Trash
trash = "5.1"

# Terminal Output & Formatting
owo-colors = { version = "4.1", features = ["supports-colors"] }
comfy-table = "7.1"
indicatif = "0.17"
dialoguer = "0.11"

# Formatting & Units
humansize = "2.1"
chrono = { version = "0.4", features = ["serde"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error Handling
anyhow = "1.0"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3"
# Deterministic mtime control for age-filter tests
filetime = "0.2"

[target.'cfg(unix)'.dependencies]
# SIGPIPE restoration for well-behaved pipeline termination
libc = "0.2"
